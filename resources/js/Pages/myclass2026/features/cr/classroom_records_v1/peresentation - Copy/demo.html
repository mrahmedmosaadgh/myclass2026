<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue Presentation Builder</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="app">
    <presentation-builder></presentation-builder>
  </div>

  <script type="module">
    const { createApp } = Vue;

    // SlideElement Component
    const SlideElement = {
      name: 'SlideElement',
      template: `
        <div
          v-if="mode === 'edit' || mode === 'animation' || shouldShowInPresent"
          :class="['slide-element', mode, { 'selected': isSelected, 'animating': isAnimating }]"
          :style="elementStyle"
          @mousedown="startDrag"
          @click.stop="selectElement"
        >
          <img 
            v-if="element.type === 'image'" 
            :src="element.src" 
            alt="Slide image"
            class="element-image"
            @dragstart.prevent
          >

          <div 
            v-else-if="element.type === 'text'"
            class="element-text"
            :contenteditable="mode === 'edit' && isSelected"
            @blur="updateTextContent"
            @mousedown.stop="startDrag"
            ref="textElement"
          >
            {{ element.content }}
          </div>

          <div v-if="mode === 'edit' && isSelected" class="element-controls">
            <button @click.stop="deleteElement" class="control-btn delete-btn">×</button>
            <div class="resize-handle" @mousedown.stop="startResize"></div>
          </div>

          <div v-if="mode === 'animation'" class="animation-badge">
            <span v-if="element.animation">{{ element.animation }}</span>
            <span v-else class="no-animation">No animation</span>
          </div>

          <div v-if="mode === 'animation'" class="state-badge" :class="element.initialState">
            {{ element.initialState === 'visible' ? '👁 Visible' : '🔒 Hidden' }}
          </div>
        </div>
      `,
      props: {
        element: Object,
        mode: String,
        presentMode: Object
      },
      data() {
        return {
          isSelected: false,
          isDragging: false,
          isResizing: false,
          dragStartX: 0,
          dragStartY: 0,
          elementStartX: 0,
          elementStartY: 0,
          resizeStartWidth: 0,
          resizeStartHeight: 0,
          isAnimating: false
        };
      },
      computed: {
        elementStyle() {
          const style = {
            left: `${this.element.x}px`,
            top: `${this.element.y}px`,
            width: this.element.type === 'image' ? `${this.element.width}px` : 'auto',
            maxWidth: this.element.type === 'text' ? `${this.element.width}px` : 'none'
          };

          if (this.element.type === 'image' && this.element.height) {
            style.height = `${this.element.height}px`;
          }

          if (this.element.type === 'text') {
            style.fontSize = `${this.element.fontSize}px`;
            style.color = this.element.color;
          }

          if (this.mode === 'present') {
            if (this.presentMode) {
              const hasBeenAnimated = this.presentMode.animatedElements?.includes(this.element.id);
              
              if (this.element.animation === 'fadeIn') {
                if (this.element.initialState === 'hidden' && !hasBeenAnimated) {
                  style.opacity = '0';
                  style.pointerEvents = 'none';
                }
              } else if (this.element.animation === 'fadeOut') {
                if (this.element.initialState === 'visible' && hasBeenAnimated) {
                  style.opacity = '0';
                  style.pointerEvents = 'none';
                }
              } else {
                if (this.element.initialState === 'hidden') {
                  style.opacity = '0';
                  style.pointerEvents = 'none';
                }
              }
            }
          }

          return style;
        },
        shouldShowInPresent() {
          return true;
        }
      },
      methods: {
        selectElement() {
          if (this.mode === 'animation') {
            this.$emit('select', this.element.id);
          }
          if (this.mode === 'present' && this.element.animation) {
            this.$emit('animate', this.element.id);
          }
          this.isSelected = true;
        },
        startDrag(event) {
          if (this.mode !== 'edit') return;
          
          this.isDragging = true;
          this.isSelected = true;
          this.dragStartX = event.clientX;
          this.dragStartY = event.clientY;
          this.elementStartX = this.element.x;
          this.elementStartY = this.element.y;

          document.addEventListener('mousemove', this.drag);
          document.addEventListener('mouseup', this.stopDrag);
        },
        drag(event) {
          if (!this.isDragging) return;

          const deltaX = event.clientX - this.dragStartX;
          const deltaY = event.clientY - this.dragStartY;

          const updated = {
            ...this.element,
            x: this.elementStartX + deltaX,
            y: this.elementStartY + deltaY
          };

          this.$emit('update', updated);
        },
        stopDrag() {
          this.isDragging = false;
          document.removeEventListener('mousemove', this.drag);
          document.removeEventListener('mouseup', this.stopDrag);
        },
        startResize(event) {
          if (this.mode !== 'edit') return;

          this.isResizing = true;
          this.dragStartX = event.clientX;
          this.dragStartY = event.clientY;
          this.resizeStartWidth = this.element.width;
          this.resizeStartHeight = this.element.height || 0;

          document.addEventListener('mousemove', this.resize);
          document.addEventListener('mouseup', this.stopResize);
        },
        resize(event) {
          if (!this.isResizing) return;

          const deltaX = event.clientX - this.dragStartX;
          const deltaY = event.clientY - this.dragStartY;

          const updated = {
            ...this.element,
            width: Math.max(50, this.resizeStartWidth + deltaX)
          };

          if (this.element.type === 'image') {
            updated.height = Math.max(50, this.resizeStartHeight + deltaY);
          }

          this.$emit('update', updated);
        },
        stopResize() {
          this.isResizing = false;
          document.removeEventListener('mousemove', this.resize);
          document.removeEventListener('mouseup', this.stopResize);
        },
        updateTextContent(event) {
          const newContent = event.target.innerText;
          if (newContent !== this.element.content) {
            this.$emit('update', {
              ...this.element,
              content: newContent
            });
          }
        },
        deleteElement() {
          this.$emit('delete', this.element.id);
        }
      }
    };

    // SlideEditor Component
    const SlideEditor = {
      name: 'SlideEditor',
      components: { SlideElement },
      template: `
        <div 
          class="slide-editor"
          tabindex="0"
          @paste="handlePaste"
          @click="focusSlide"
          ref="slideArea"
        >
          <div class="slide-canvas">
            <slide-element
              v-for="element in slide.elements"
              :key="element.id"
              :element="element"
              :mode="'edit'"
              @update="updateElement"
              @delete="deleteElement"
            />
          </div>
        </div>
      `,
      props: ['slide'],
      methods: {
        focusSlide() {
          this.$refs.slideArea.focus();
        },
        async handlePaste(event) {
          event.preventDefault();
          const items = event.clipboardData.items;

          for (let item of items) {
            if (item.type.indexOf('image') !== -1) {
              const blob = item.getAsFile();
              const reader = new FileReader();
              
              reader.onload = (e) => {
                this.addImageElement(e.target.result);
              };
              reader.readAsDataURL(blob);
            } else if (item.type === 'text/plain') {
              item.getAsString((text) => {
                this.addTextElement(text);
              });
            }
          }
        },
        addImageElement(src) {
          const newElement = {
            id: this.generateId(),
            type: 'image',
            src: src,
            x: 100,
            y: 100,
            width: 300,
            height: 200,
            initialState: 'visible',
            animation: null
          };
          
          const updatedSlide = {
            ...this.slide,
            elements: [...this.slide.elements, newElement]
          };
          this.$emit('update:slide', updatedSlide);
        },
        addTextElement(text) {
          const newElement = {
            id: this.generateId(),
            type: 'text',
            content: text,
            x: 150,
            y: 150,
            width: 400,
            fontSize: 24,
            color: '#ffffff',
            initialState: 'visible',
            animation: null
          };
          
          const updatedSlide = {
            ...this.slide,
            elements: [...this.slide.elements, newElement]
          };
          this.$emit('update:slide', updatedSlide);
        },
        updateElement(updatedElement) {
          const updatedSlide = {
            ...this.slide,
            elements: this.slide.elements.map(el => 
              el.id === updatedElement.id ? updatedElement : el
            )
          };
          this.$emit('update:slide', updatedSlide);
        },
        deleteElement(elementId) {
          const updatedSlide = {
            ...this.slide,
            elements: this.slide.elements.filter(el => el.id !== elementId)
          };
          this.$emit('update:slide', updatedSlide);
        },
        generateId() {
          return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }
      },
      mounted() {
        this.focusSlide();
      }
    };

    // AnimationEditor Component
    const AnimationEditor = {
      name: 'AnimationEditor',
      components: { SlideElement },
      template: `
        <div class="animation-editor">
          <div class="slide-canvas">
            <slide-element
              v-for="element in slide.elements"
              :key="element.id"
              :element="element"
              :mode="'animation'"
              @select="selectElement"
            />
          </div>

          <div class="animation-panel" v-if="selectedElement">
            <h3>Animation Settings</h3>
            
            <div class="setting-group">
              <label>Initial State</label>
              <div class="button-group">
                <button 
                  @click="updateInitialState('visible')"
                  :class="['state-btn', selectedElement.initialState === 'visible' ? 'active' : '']"
                >
                  👁 Visible
                </button>
                <button 
                  @click="updateInitialState('hidden')"
                  :class="['state-btn', selectedElement.initialState === 'hidden' ? 'active' : '']"
                >
                  🔒 Hidden
                </button>
              </div>
            </div>

            <div class="setting-group">
              <label>Animation on Click</label>
              <div class="button-group vertical">
                <button 
                  @click="updateAnimation(null)"
                  :class="['anim-btn', selectedElement.animation === null ? 'active' : '']"
                >
                  None
                </button>
                <button 
                  @click="updateAnimation('fadeIn')"
                  :class="['anim-btn', selectedElement.animation === 'fadeIn' ? 'active' : '']"
                >
                  ✨ Fade In
                </button>
                <button 
                  @click="updateAnimation('fadeOut')"
                  :class="['anim-btn', selectedElement.animation === 'fadeOut' ? 'active' : '']"
                >
                  💫 Fade Out
                </button>
              </div>
            </div>

            <div class="info-box">
              <p><strong>How it works:</strong></p>
              <ul>
                <li><strong>Initial State:</strong> Element visibility at presentation start</li>
                <li><strong>Animation:</strong> What happens when you click the element during presentation</li>
                <li><strong>Fade In:</strong> Best with "Hidden" initial state</li>
                <li><strong>Fade Out:</strong> Best with "Visible" initial state</li>
              </ul>
            </div>
          </div>

          <div class="no-selection" v-else>
            <p>👆 Click an element on the slide to configure its animation</p>
          </div>
        </div>
      `,
      props: ['slide'],
      data() {
        return {
          selectedElementId: null
        };
      },
      computed: {
        selectedElement() {
          if (!this.selectedElementId) return null;
          return this.slide.elements.find(el => el.id === this.selectedElementId);
        }
      },
      methods: {
        selectElement(elementId) {
          this.selectedElementId = elementId;
        },
        updateInitialState(state) {
          if (!this.selectedElement) return;

          const updatedElements = this.slide.elements.map(el => 
            el.id === this.selectedElementId 
              ? { ...el, initialState: state }
              : el
          );

          this.$emit('update:slide', {
            ...this.slide,
            elements: updatedElements
          });
        },
        updateAnimation(animation) {
          if (!this.selectedElement) return;

          const updatedElements = this.slide.elements.map(el => 
            el.id === this.selectedElementId 
              ? { ...el, animation: animation }
              : el
          );

          this.$emit('update:slide', {
            ...this.slide,
            elements: updatedElements
          });
        }
      }
    };

    // SlidePresenter Component
    const SlidePresenter = {
      name: 'SlidePresenter',
      components: { SlideElement },
      template: `
        <div class="slide-presenter">
          <div class="present-canvas">
            <slide-element
              v-for="element in currentSlide.elements"
              :key="element.id"
              :element="element"
              :mode="'present'"
              :present-mode="presentState"
              @animate="handleAnimate"
            />
          </div>

          <div class="present-controls">
            <button 
              @click="previousSlide" 
              :disabled="currentIndex === 0"
              class="nav-btn"
            >
              ◀ Previous
            </button>
            
            <div class="slide-counter">
              {{ currentIndex + 1 }} / {{ slides.length }}
            </div>
            
            <button 
              @click="nextSlide" 
              :disabled="currentIndex === slides.length - 1"
              class="nav-btn"
            >
              Next ▶
            </button>
            
            <button @click="exitPresentation" class="exit-btn">
              Exit
            </button>
          </div>

          <div class="keyboard-hint">
            Use ← → arrow keys to navigate | Click elements to trigger animations | ESC to exit
          </div>
        </div>
      `,
      props: {
        slides: Array,
        initialSlide: {
          type: Number,
          default: 0
        }
      },
      data() {
        return {
          currentIndex: this.initialSlide,
          presentState: {
            animatedElements: []
          }
        };
      },
      computed: {
        currentSlide() {
          return this.slides[this.currentIndex];
        }
      },
      methods: {
        handleAnimate(elementId) {
          const element = this.currentSlide.elements.find(el => el.id === elementId);
          if (!element || !element.animation) return;

          if (this.presentState.animatedElements.includes(elementId)) {
            this.presentState.animatedElements = this.presentState.animatedElements.filter(
              id => id !== elementId
            );
          } else {
            this.presentState.animatedElements.push(elementId);
          }

          this.presentState = { ...this.presentState };
        },
        nextSlide() {
          if (this.currentIndex < this.slides.length - 1) {
            this.currentIndex++;
            this.resetAnimations();
          }
        },
        previousSlide() {
          if (this.currentIndex > 0) {
            this.currentIndex--;
            this.resetAnimations();
          }
        },
        resetAnimations() {
          this.presentState = {
            animatedElements: []
          };
        },
        exitPresentation() {
          this.$emit('exit');
        },
        handleKeydown(event) {
          if (event.key === 'ArrowRight') {
            this.nextSlide();
          } else if (event.key === 'ArrowLeft') {
            this.previousSlide();
          } else if (event.key === 'Escape') {
            this.exitPresentation();
          }
        }
      },
      mounted() {
        window.addEventListener('keydown', this.handleKeydown);
      },
      beforeUnmount() {
        window.removeEventListener('keydown', this.handleKeydown);
      }
    };

    // Main PresentationBuilder Component
    const PresentationBuilder = {
      name: 'PresentationBuilder',
      components: {
        SlideEditor,
        AnimationEditor,
        SlidePresenter
      },
      template: `
        <div class="presentation-builder">
          <div class="toolbar">
            <div class="toolbar-section">
              <button @click="addSlide" class="btn btn-primary">
                <span class="icon">+</span> Add Slide
              </button>
              <button @click="deleteCurrentSlide" class="btn btn-danger" :disabled="slides.length <= 1">
                <span class="icon">🗑</span> Delete Slide
              </button>
            </div>

            <div class="toolbar-section">
              <button 
                @click="mode = 'edit'" 
                :class="['btn', mode === 'edit' ? 'btn-active' : '']"
              >
                <span class="icon">✏️</span> Edit Mode
              </button>
              <button 
                @click="mode = 'animation'" 
                :class="['btn', mode === 'animation' ? 'btn-active' : '']"
              >
                <span class="icon">✨</span> Animation Mode
              </button>
              <button 
                @click="mode = 'present'" 
                :class="['btn', mode === 'present' ? 'btn-active' : '']"
              >
                <span class="icon">▶️</span> Present
              </button>
            </div>

            <div class="toolbar-section">
              <button @click="exportJSON" class="btn">
                <span class="icon">💾</span> Export JSON
              </button>
              <button @click="triggerImport" class="btn">
                <span class="icon">📁</span> Import JSON
              </button>
              <input 
                ref="fileInput" 
                type="file" 
                accept=".json" 
                @change="importJSON" 
                style="display: none"
              >
            </div>
          </div>

          <div class="slide-nav" v-if="mode !== 'present'">
            <button 
              v-for="(slide, index) in slides" 
              :key="slide.id"
              @click="currentSlideIndex = index"
              :class="['slide-thumb', currentSlideIndex === index ? 'active' : '']"
            >
              {{ index + 1 }}
            </button>
          </div>

          <div class="slide-container" v-if="currentSlide">
            <slide-editor
              v-if="mode === 'edit'"
              :slide="currentSlide"
              @update:slide="updateSlide"
            />
            
            <animation-editor
              v-else-if="mode === 'animation'"
              :slide="currentSlide"
              @update:slide="updateSlide"
            />
            
            <slide-presenter
              v-else-if="mode === 'present'"
              :slides="slides"
              :initial-slide="currentSlideIndex"
              @exit="mode = 'edit'"
            />
          </div>

          <div class="instructions" v-if="mode === 'edit'">
            <p><strong>Tip:</strong> Click on the slide to paste images/text from clipboard (Ctrl+V)</p>
          </div>
        </div>
      `,
      data() {
        return {
          slides: [
            {
              id: this.generateId(),
              elements: []
            }
          ],
          currentSlideIndex: 0,
          mode: 'edit'
        };
      },
      computed: {
        currentSlide() {
          return this.slides[this.currentSlideIndex];
        }
      },
      methods: {
        generateId() {
          return Date.now().toString(36) + Math.random().toString(36).substr(2);
        },
        addSlide() {
          this.slides.push({
            id: this.generateId(),
            elements: []
          });
          this.currentSlideIndex = this.slides.length - 1;
        },
        deleteCurrentSlide() {
          if (this.slides.length > 1) {
            this.slides.splice(this.currentSlideIndex, 1);
            if (this.currentSlideIndex >= this.slides.length) {
              this.currentSlideIndex = this.slides.length - 1;
            }
          }
        },
        updateSlide(updatedSlide) {
          this.slides[this.currentSlideIndex] = updatedSlide;
        },
        exportJSON() {
          const data = JSON.stringify(this.slides, null, 2);
          const blob = new Blob([data], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `presentation-${Date.now()}.json`;
          a.click();
          URL.revokeObjectURL(url);
        },
        triggerImport() {
          this.$refs.fileInput.click();
        },
        importJSON(event) {
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported) && imported.length > 0) {
                  this.slides = imported;
                  this.currentSlideIndex = 0;
                } else {
                  alert('Invalid JSON format');
                }
              } catch (error) {
                alert('Error parsing JSON: ' + error.message);
              }
            };
            reader.readAsText(file);
          }
          event.target.value = '';
        }
      }
    };

    // CSS Styles
    const styles = `
      .presentation-builder {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #1a1a1a;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }

      .toolbar {
        display: flex;
        gap: 20px;
        padding: 15px 20px;
        background: #2a2a2a;
        border-bottom: 2px solid #3a3a3a;
        flex-wrap: wrap;
      }

      .toolbar-section {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .btn {
        padding: 8px 16px;
        background: #3a3a3a;
        border: 1px solid #4a4a4a;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        transition: all 0.2s;
      }

      .btn:hover:not(:disabled) {
        background: #4a4a4a;
        border-color: #5a5a5a;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background: #4a90e2;
        border-color: #5a9ff2;
      }

      .btn-primary:hover {
        background: #5a9ff2;
      }

      .btn-danger {
        background: #e24a4a;
        border-color: #f25a5a;
      }

      .btn-danger:hover:not(:disabled) {
        background: #f25a5a;
      }

      .btn-active {
        background: #6a4ae2;
        border-color: #7a5af2;
      }

      .icon {
        font-size: 16px;
      }

      .slide-nav {
        display: flex;
        gap: 8px;
        padding: 15px 20px;
        background: #252525;
        overflow-x: auto;
      }

      .slide-thumb {
        min-width: 60px;
        height: 45px;
        background: #3a3a3a;
        border: 2px solid #4a4a4a;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
      }

      .slide-thumb:hover {
        border-color: #6a4ae2;
      }

      .slide-thumb.active {
        background: #6a4ae2;
        border-color: #7a5af2;
      }

      .slide-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: hidden;
      }

      .instructions {
        padding: 10px 20px;
        background: #2a2a2a;
        border-top: 1px solid #3a3a3a;
        font-size: 13px;
        color: #aaa;
      }

      .instructions strong {
        color: #fff;
      }

      .slide-editor {
        width: 100%;
        max-width: 1200px;
        height: 675px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        outline: none;
        position: relative;
      }

      .slide-canvas {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        border-radius: 8px;
      }

      .slide-element {
        position: absolute;
        cursor: move;
        transition: opacity 0.5s ease;
      }

      .slide-element.edit {
        outline: 2px solid transparent;
      }

      .slide-element.edit.selected {
        outline: 2px solid #4a90e2;
        outline-offset: 2px;
      }

      .slide-element.animation {
        cursor: pointer;
        outline: 2px dashed #6a4ae2;
        outline-offset: 4px;
      }

      .slide-element.present {
        cursor: pointer;
      }

      .element-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        pointer-events: none;
      }

      .element-text {
        padding: 8px 12px;
        min-width: 50px;
        min-height: 30px;
        word-wrap: break-word;
        white-space: pre-wrap;
        outline: none;
        background: transparent;
      }

      .element-text[contenteditable="true"] {
        background: rgba(74, 144, 226, 0.1);
        border-radius: 4px;
      }

      .element-controls {
        position: absolute;
        top: -12px;
        right: -12px;
        display: flex;
        gap: 4px;
      }

      .control-btn {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: none;
        background: #e24a4a;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        padding: 0;
      }

      .control-btn:hover {
        background: #f25a5a;
      }

      .resize-handle {
        position: absolute;
        bottom: -12px;
        right: -12px;
        width: 16px;
        height: 16px;
        background: #4a90e2;
        border: 2px solid white;
        border-radius: 50%;
        cursor: nwse-resize;
      }

      .resize-handle:hover {
        background: #5a9ff2;
      }

      .animation-badge {
        position: absolute;
        top: -30px;
        left: 50%;
        transform: translateX(-50%);
        background: #6a4ae2;
        color: white;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        pointer-events: none;
      }

      .no-animation {
        opacity: 0.6;
      }

      .state-badge {
        position: absolute;
        bottom: -30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        pointer-events: none;
      }

      .state-badge.visible {
        background: #4ade80;
        color: #064e3b;
      }

      .state-badge.hidden {
        background: #fb923c;
        color: #431407;
      }

      .animation-editor {
        display: flex;
        gap: 20px;
        width: 100%;
        max-width: 1400px;
      }

      .animation-editor .slide-canvas {
        flex: 0 0 900px;
        height: 506px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
      }

      .animation-panel {
        flex: 1;
        background: #2a2a2a;
        border-radius: 8px;
        padding: 20px;
        overflow-y: auto;
      }

      .animation-panel h3 {
        margin: 0 0 20px 0;
        color: #fff;
        font-size: 20px;
      }

      .setting-group {
        margin-bottom: 24px;
      }

      .setting-group label {
        display: block;
        margin-bottom: 8px;
        color: #aaa;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .button-group {
        display: flex;
        gap: 8px;
      }

      .button-group.vertical {
        flex-direction: column;
      }

      .state-btn,
      .anim-btn {
        flex: 1;
        padding: 12px 16px;
        background: #3a3a3a;
        border: 2px solid #4a4a4a;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s;
        text-align: left;
      }

      .state-btn:hover,
      .anim-btn:hover {
        background: #4a4a4a;
        border-color: #5a5a5a;
      }

      .state-btn.active {
        background: #4ade80;
        border-color: #4ade80;
        color: #064e3b;
      }

      .anim-btn.active {
        background: #6a4ae2;
        border-color: #7a5af2;
        color: #fff;
      }

      .info-box {
        background: #3a3a3a;
        border-left: 4px solid #6a4ae2;
        padding: 16px;
        border-radius: 6px;
        margin-top: 24px;
      }

      .info-box p {
        margin: 0 0 12px 0;
        color: #fff;
        font-size: 14px;
      }

      .info-box ul {
        margin: 0;
        padding-left: 20px;
        color: #aaa;
        font-size: 13px;
        line-height: 1.6;
      }

      .info-box li {
        margin-bottom: 6px;
      }

      .info-box strong {
        color: #fff;
      }

      .no-selection {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2a2a2a;
        border-radius: 8px;
        border: 2px dashed #4a4a4a;
      }

      .no-selection p {
        color: #aaa;
        font-size: 16px;
        text-align: center;
        padding: 40px;
      }

      .slide-presenter {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .present-canvas {
        flex: 1;
        width: 100%;
        max-width: 1200px;
        max-height: 675px;
        background: #ffffff;
        position: relative;
        margin: 20px;
        border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }

      .present-controls {
        display: flex;
        gap: 20px;
        align-items: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 12px;
        margin-bottom: 20px;
      }

      .nav-btn {
        padding: 12px 24px;
        background: #4a90e2;
        border: none;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.2s;
      }

      .nav-btn:hover:not(:disabled) {
        background: #5a9ff2;
        transform: translateY(-2px);
      }

      .nav-btn:disabled {
        background: #3a3a3a;
        cursor: not-allowed;
        opacity: 0.5;
      }

      .slide-counter {
        color: white;
        font-size: 18px;
        font-weight: 600;
        min-width: 80px;
        text-align: center;
      }

      .exit-btn {
        padding: 12px 24px;
        background: #e24a4a;
        border: none;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.2s;
      }

      .exit-btn:hover {
        background: #f25a5a;
      }

      .keyboard-hint {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
        text-align: center;
      }
    `;

    const styleSheet = document.createElement('style');
    styleSheet.textContent = styles;
    document.head.appendChild(styleSheet);

    // Create and mount the app
    createApp(PresentationBuilder).mount('#app');
  </script>
</body>
</html>
