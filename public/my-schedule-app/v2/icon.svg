<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="My Schedule V2">
  <rect width="512" height="512" rx="96" fill="#1e293b"/>
  <rect x="36" y="36" width="440" height="440" rx="72" fill="none" stroke="#3b82f6" stroke-width="12"/>
  
  <!-- Calendar Grid -->
  <g fill="#3b82f6">
    <!-- Header -->
    <rect x="76" y="76" width="360" height="60" rx="8"/>
    
    <!-- Calendar Grid -->
    <rect x="76" y="156" width="100" height="80" rx="6"/>
    <rect x="196" y="156" width="100" height="80" rx="6"/>
    <rect x="316" y="156" width="120" height="80" rx="6"/>
    
    <rect x="76" y="256" width="100" height="80" rx="6"/>
    <rect x="196" y="256" width="100" height="80" rx="6"/>
    <rect x="316" y="256" width="120" height="80" rx="6"/>
    
    <rect x="76" y="356" width="100" height="80" rx="6"/>
    <rect x="196" y="356" width="100" height="80" rx="6"/>
    <rect x="316" y="356" width="120" height="80" rx="6"/>
  </g>
  
  <!-- Clock overlay -->
  <g transform="translate(400, 112)">
    <circle cx="0" cy="0" r="24" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="6" y2="3" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
