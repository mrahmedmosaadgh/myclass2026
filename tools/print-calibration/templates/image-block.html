<!DOCTYPE html>
<html lang="en" data-layout-version="v1.0">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Block Template</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.4;
      letter-spacing: 0;
      word-break: normal;
      font-size: 12pt;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      padding: 12mm;
      background: white;
    }

    .question {
      margin-bottom: 4mm;
    }

    .stem {
      font-weight: bold;
      margin-bottom: 3mm;
    }

    .image-container {
      width: 100%;
      max-height: 120mm;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      border: 1px solid #ddd;
    }

    .image-container img {
      max-width: 100%;
      max-height: 120mm;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="question image" id="test-block">
      <div class="stem">Sample question with an image or diagram.</div>
      <div class="image-container">
        <div style="width: 100mm; height: 80mm; background: #ddd; display: flex; align-items: center; justify-content: center;">
          [Placeholder Image 100×80mm]
        </div>
      </div>
    </div>
  </div>
</body>
</html>
